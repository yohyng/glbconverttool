<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLB Converter</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <h1>GLB Converter</h1>
    <p class="subtitle">OBJ を GLB に変換します。ファイルはサーバーに保存されません。</p>

    <div class="dropzone" id="dropzone">
      <div class="dropzone-inner">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p>ここにファイルをドロップ<br>または<span class="link">クリックして選択</span></p>
        <p class="hint">対応形式: .obj（マテリアルがある場合 .mtl も同時に選択可）</p>
      </div>
      <input type="file" id="fileInput" accept=".obj,.mtl" multiple hidden />
    </div>

    <div class="file-list" id="fileList"></div>

    <button class="btn" id="convertBtn" disabled>GLB に変換する</button>

    <div class="status" id="status"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
