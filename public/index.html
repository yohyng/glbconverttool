<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLB Converter</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <h1>GLB Converter</h1>
    <p class="subtitle">3D モデルをブラウザ内で GLB に変換します。ファイルは外部に送信されません。</p>
    <p class="version" id="version"></p>

    <div class="dropzone" id="dropzone">
      <div class="dropzone-inner">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p>ここにファイルをドロップ<br>または<span class="link">クリックして選択</span></p>
        <p class="hint">OBJ · FBX · DAE · GLTF · GLB<br>MTL・テクスチャ画像（PNG/JPG など）も一緒に選択可</p>
      </div>
      <input type="file" id="fileInput"
        accept=".obj,.fbx,.dae,.gltf,.glb,.mtl,.png,.jpg,.jpeg,.webp,.bmp,.tga"
        multiple hidden />
    </div>

    <div class="file-list" id="fileList"></div>

    <div class="status" id="status"></div>

    <div class="preview-wrap" id="previewWrap" hidden>
      <canvas id="preview"></canvas>
    </div>

    <button class="btn" id="convertBtn" disabled>GLB としてダウンロード</button>

    <a href="/compare.html" class="compare-link">モデル比較ビューを開く →</a>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="/app.js"></script>
</body>
</html>
